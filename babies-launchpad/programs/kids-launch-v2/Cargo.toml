[package]
name = "kids-launch-v2"
version = "0.1.0"
edition = "2021"
license = "PolyForm-Noncommercial-1.0.0"
[lib]
crate-type = ["cdylib", "lib"]
[dependencies]
# Same pin as programs/atomic-launch and programs/kids-distribution: shared account-reading helpers, one SBF toolchain build.
solana-program = "=2.3.0"
[features]
no-entrypoint = []
# Localnet builds seal their own treasury: PLATFORM_TREASURY is read from KIDS_LOCALNET_TREASURY_HEX at build time
# instead of the mainnet key. Never enable for a mainnet build.
localnet-treasury = []
