name: Private KIDS readiness
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/readiness.yml'
      - 'babies-launchpad/deployment/health-check.mjs'
  workflow_dispatch:
    inputs:
      simulate_failure:
        description: 'Set to true to force a failing run and prove that alerts reach the owner (no service is touched)'
        required: false
        default: 'false'
  schedule:
    - cron: '7,22,37,52 * * * *'
permissions:
  contents: read
concurrency:
  group: private-kids-readiness
  cancel-in-progress: false
jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - run: node babies-launchpad/deployment/health-check.mjs
        env:
          KIDS_SIMULATE_FAILURE: ${{ github.event.inputs.simulate_failure }}
