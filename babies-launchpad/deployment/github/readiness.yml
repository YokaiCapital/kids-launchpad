name: KIDS readiness (mainnet, test ledger, kids.fun)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/readiness.yml'
      - 'babies-launchpad/deployment/health-check.mjs'
      - 'babies-launchpad/shared/service-status.mjs'
  workflow_dispatch:
    inputs:
      simulate_failure:
        description: 'Set to true to force a failing run and prove that alerts reach the owner (no service is touched)'
        required: false
        default: 'false'
  schedule:
    - cron: '7,22,37,52 * * * *'
permissions:
  contents: read
  issues: write
concurrency:
  group: private-kids-readiness
  cancel-in-progress: false
jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - run: node babies-launchpad/deployment/health-check.mjs
        env:
          KIDS_SIMULATE_FAILURE: ${{ github.event.inputs.simulate_failure }}
      # Alert delivery that does not depend on GitHub's email settings: an issue is opened (or bumped) on failure and
      # closed on the next success; when the KIDS_ALERT_WEBHOOK secret is set (Telegram bot sendMessage URL or a
      # Discord/Slack webhook), a message is posted there too.
      - if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WEBHOOK: ${{ secrets.KIDS_ALERT_WEBHOOK }}
        run: |
          set -e
          TITLE="KIDS readiness is failing"
          BODY="The readiness monitor failed at $(date -u +%Y-%m-%dT%H:%M:%SZ). Run: $RUN_URL"
          EXISTING=$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search "$TITLE in:title" --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then gh issue comment "$EXISTING" -R "$GITHUB_REPOSITORY" --body "$BODY"; else gh issue create -R "$GITHUB_REPOSITORY" --title "$TITLE" --body "$BODY"; fi
          if [ -n "$WEBHOOK" ]; then
            if printf '%s' "$WEBHOOK" | grep -q 'api.telegram.org'; then curl -sS -m 15 -X POST "$WEBHOOK" --data-urlencode "text=$TITLE. $BODY" >/dev/null || true;
            else curl -sS -m 15 -X POST -H 'content-type: application/json' --data "{\"content\":\"$TITLE. $BODY\",\"text\":\"$TITLE. $BODY\"}" "$WEBHOOK" >/dev/null || true; fi
          fi
      - if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          EXISTING=$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search "KIDS readiness is failing in:title" --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then gh issue close "$EXISTING" -R "$GITHUB_REPOSITORY" --comment "Readiness recovered at $(date -u +%Y-%m-%dT%H:%M:%SZ)."; fi
