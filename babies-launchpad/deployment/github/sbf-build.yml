name: KIDS reproducible program build
# Builds the launch program's SBF on two independent runners with the pinned Anza toolchain and requires the two
# SHA-256 hashes to match. The hash is evidence for the deployed program's provenance; it does not replace a review.
on:
  push:
    branches: [main]
    paths:
      - 'babies-launchpad/programs/atomic-launch/**'
      - '.github/workflows/sbf-build.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-22.04]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Install the pinned Anza toolchain (cargo-build-sbf 4.0.0, platform-tools v1.53)
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v4.0.1/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      - name: Build
        run: |
          cargo-build-sbf --version
          cargo-build-sbf --manifest-path babies-launchpad/programs/atomic-launch/Cargo.toml --sbf-out-dir "$RUNNER_TEMP/sbf"
          sha256sum "$RUNNER_TEMP/sbf/kids_atomic_launch.so" | tee "$RUNNER_TEMP/sbf/kids_atomic_launch.sha256"
          cp "$RUNNER_TEMP/sbf/kids_atomic_launch.sha256" "kids_atomic_launch-${{ matrix.runner }}.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sbf-${{ matrix.runner }}
          path: |
            ${{ runner.temp }}/sbf/kids_atomic_launch.so
            kids_atomic_launch-${{ matrix.runner }}.sha256
          retention-days: 30
  compare:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: artifacts
      - name: Both runners must produce the same binary
        run: |
          find artifacts -name '*.sha256' -exec cat {} \;
          hashes=$(find artifacts -name '*.sha256' -exec awk '{print $1}' {} \; | sort -u)
          echo "distinct hashes: $(echo "$hashes" | wc -l)"
          test "$(echo "$hashes" | wc -l)" -eq 1
          echo "reproducible SHA-256: $hashes"
