name: Mandatory secret protection
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KIDS_CONFIDENTIAL_TERMS: ${{ secrets.KIDS_CONFIDENTIAL_TERMS }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-pinned scanner
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/gitleaks.tar.gz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  '"$RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check --status
          mkdir -p "$RUNNER_TEMP/secret-tools"
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/secret-tools" gitleaks
          echo "$RUNNER_TEMP/secret-tools" >> "$GITHUB_PATH"
      - name: Check reachable history and current source
        run: |
          python3 scripts/secret-scan.py history
          python3 scripts/secret-scan.py worktree
      - name: Exercise blocking and redaction regressions
        run: python3 scripts/test-secret-scan.py
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - name: Scan both frontend build variants before publication
        run: |
          npm ci --ignore-scripts --prefix babies-launchpad/localnet
          npm ci --ignore-scripts --prefix babies-launchpad/kids-mint-worker
          npm ci --ignore-scripts --prefix babies-launchpad/interaction-review
          npm --prefix babies-launchpad/interaction-review run build
          sh scripts/check-publication.sh babies-launchpad/interaction-review/dist
          VITE_KIDS_PUBLIC_LAUNCHES=1 npm --prefix babies-launchpad/interaction-review run build
          sh scripts/check-publication.sh babies-launchpad/interaction-review/dist
