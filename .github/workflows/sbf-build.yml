name: KIDS reproducible program build
# Builds each program's SBF on two independent runners with the pinned Anza toolchain and requires the two
# SHA-256 hashes to match. The hash is evidence for the deployed program's provenance; it does not replace a review.
on:
  push:
    branches: [main]
    paths:
      - 'babies-launchpad/programs/atomic-launch/**'
      - 'babies-launchpad/programs/kids-distribution/**'
      - 'babies-launchpad/programs/kids-launch-v2/**'
      - 'babies-launchpad/programs/kids-launch-v3/**'
      - '.github/workflows/sbf-build.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-22.04]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Install the pinned Anza toolchain (cargo-build-sbf 4.0.0, platform-tools v1.53)
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v4.0.1/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      - name: Build
        run: |
          cargo-build-sbf --version
          for program in atomic-launch kids-distribution kids-launch-v3; do
            cargo-build-sbf --manifest-path "babies-launchpad/programs/$program/Cargo.toml" --sbf-out-dir "$RUNNER_TEMP/sbf"
          done
          for so in kids_atomic_launch kids_distribution kids_launch_v3; do
            sha256sum "$RUNNER_TEMP/sbf/$so.so" | tee "$RUNNER_TEMP/sbf/$so.sha256"
            cp "$RUNNER_TEMP/sbf/$so.sha256" "$so-${{ matrix.runner }}.sha256"
          done
      - name: Install checksum-pinned scanner
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/gitleaks.tar.gz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  '"$RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check --status
          mkdir -p "$RUNNER_TEMP/secret-tools"
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/secret-tools" gitleaks
          echo "$RUNNER_TEMP/secret-tools" >> "$GITHUB_PATH"
      - name: Scan exact binary upload artifacts
        env:
          KIDS_CONFIDENTIAL_TERMS: ${{ secrets.KIDS_CONFIDENTIAL_TERMS }}
        run: |
          mkdir -p "$RUNNER_TEMP/sbf-upload"
          for so in kids_atomic_launch kids_distribution kids_launch_v3; do
            cp "$RUNNER_TEMP/sbf/$so.so" "$RUNNER_TEMP/sbf-upload/"
            cp "$so-${{ matrix.runner }}.sha256" "$RUNNER_TEMP/sbf-upload/"
          done
          python3 scripts/secret-scan.py artifacts "$RUNNER_TEMP/sbf-upload"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sbf-${{ matrix.runner }}
          path: ${{ runner.temp }}/sbf-upload/
          retention-days: 30
  compare:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: artifacts
      - name: Both runners must produce the same binary, per program
        run: |
          find artifacts -name '*.sha256' -exec cat {} \;
          for so in kids_atomic_launch kids_distribution kids_launch_v3; do
            hashes=$(find artifacts -name "$so-*.sha256" -exec awk '{print $1}' {} \; | sort -u)
            echo "$so distinct hashes: $(echo "$hashes" | wc -l)"
            test "$(echo "$hashes" | wc -l)" -eq 1
            echo "reproducible SHA-256 ($so): $hashes"
          done
